<hbox flex="1" id="browser">

  <!-- ═══════════════════════════════════════════════════════
       LEFT: Sidebar Shell
       Contains the window controls row and the revamp sidebar.
       Width is dictated naturally by sidebar-main content.
       ═══════════════════════════════════════════════════════ -->
  <vbox id="w3ai-sidebar-shell">

    <!-- Window controls (●●●) + back/forward, top of sidebar -->
    <hbox id="w3ai-sidebar-window-controls" class="browser-titlebar">
#include titlebar-items.inc.xhtml
      <hbox id="w3ai-navctrl-buttons">
        <toolbarbutton id="w3ai-back-btn" class="toolbarbutton-1 w3ai-navctrl-btn"
                       command="Browser:BackOrBackDuplicate"
                       tooltip="back-button-tooltip"
                       context="backForwardMenu"/>
        <toolbarbutton id="w3ai-forward-btn" class="toolbarbutton-1 w3ai-navctrl-btn"
                       command="Browser:ForwardOrForwardDuplicate"
                       tooltip="forward-button-tooltip"
                       context="backForwardMenu"/>
      </hbox>
    </hbox>

    <!-- Revamp sidebar: tabs, launcher, panels -->
    <box context="sidebar-context-menu" id="sidebar-main" hidden="true">
      <html:sidebar-main flex="1">
        <box id="vertical-tabs" slot="tabstrip" customizable="true" contextmenu="toolbar-context-menu"></box>
      </html:sidebar-main>
    </box>
    <splitter id="sidebar-launcher-splitter" class="chromeclass-extrachrome sidebar-splitter" resizebefore="sibling" resizeafter="none" hidden="true"/>

  </vbox><!-- #w3ai-sidebar-shell -->

  <!-- ═══════════════════════════════════════════════════════
       RIGHT: Main Panel
       Navigator toolbox (URL bar, bookmarks, notifications)
       sits at the top of this column; content area below.
       All toolbox children are naturally bounded to this
       column — no margin or offset hacks required.
       ═══════════════════════════════════════════════════════ -->
  <vbox id="w3ai-main-panel" flex="1">

#include navigator-toolbox.inc.xhtml

    <hbox id="w3ai-content-area" flex="1">
      <vbox id="sidebar-box" hidden="true" class="chromeclass-extrachrome">
        <box id="sidebar-header" align="center">
          <toolbarbutton id="sidebar-switcher-target" class="tabbable" aria-expanded="false">
            <image id="sidebar-icon" consumeanchor="sidebar-switcher-target"/>
            <label id="sidebar-title" crop="end" control="sidebar"/>
            <image id="sidebar-switcher-arrow"/>
          </toolbarbutton>
          <image id="sidebar-throbber"/>
          <spacer id="sidebar-spacer"/>
          <toolbarbutton id="sidebar-close" class="close-icon tabbable" data-l10n-id="sidebar-close-button"/>
        </box>
        <stack class="sidebar-browser-stack">
          <browser id="sidebar" autoscroll="false" disablehistory="true" disablefullscreen="true" tooltip="aHTMLTooltip"/>
        </stack>
      </vbox>
      <splitter id="sidebar-splitter" class="chromeclass-extrachrome sidebar-splitter" resizebefore="sibling" resizeafter="none" hidden="true"/>
      <tabbox id="tabbrowser-tabbox" flex="1" tabcontainer="tabbrowser-tabs">
        <tabpanels id="tabbrowser-tabpanels" flex="1" selectedIndex="0"/>
      </tabbox>
      <splitter id="ai-window-splitter" class="chromeclass-extrachrome sidebar-splitter" resizebefore="none" resizeafter="sibling" collapsed="true"/>
      <vbox id="ai-window-box" collapsed="true" class="chromeclass-extrachrome ai-window-right-sidebar">
        <stack class="ai-window-browser-stack" flex="1">
        </stack>
      </vbox>
    </hbox><!-- #w3ai-content-area -->

  </vbox><!-- #w3ai-main-panel -->

</hbox><!-- #browser -->
